<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tabla</title>
</head>
<body>
  <h1>Ejemplo de tabla</h1>
  <table border="1">
    <caption>Lista de productos</caption>
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Precio</th></tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>Producto A</td><td>$10</td></tr>
      <tr><td>2</td><td>Producto B</td><td>$20</td></tr>
    </tbody>
  </table>
</body>
</html>
