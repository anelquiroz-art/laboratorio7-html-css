<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Formulario</title>
</head>
<body>
  <h1>Formulario de contacto</h1>
  <form action="#" method="post">
    <label for="name">Nombre:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Correo:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label>Género:</label><br>
    <input type="radio" id="m" name="gender" value="m"><label for="m">M</label>
    <input type="radio" id="f" name="gender" value="f"><label for="f">F</label><br><br>

    <label for="country">País:</label><br>
    <select id="country" name="country">
      <option value="bo">Bolivia</option>
      <option value="es">España</option>
    </select><br><br>

    <label for="msg">Mensaje:</label><br>
    <textarea id="msg" name="message" rows="4"></textarea><br><br>

    <input type="checkbox" id="subscribe" name="subscribe">
    <label for="subscribe">Suscribirme</label><br><br>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
